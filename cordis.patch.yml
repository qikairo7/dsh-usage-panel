# dsh-usage-panel bundle patch: mounts the usage panel into a dsh profile.
# Applied as a profile layer when this package is installed with
# `dsh plugin add "github:owner/dsh-usage-panel"`.
#
# All keys are optional; defaults resolve host-side:
#   sessionsDir: override the sessions root (default: $DSH_HOME/sessions)
#   ledgerPath:  override the web-router ledger file (default: pending WS1)
#   refreshMs:   incremental rescan interval floor, default 60000 (>= 5000)

- insert:
    - id: usage-panel
      name: 'dsh-usage-panel'
      config:
        refreshMs: 60000
